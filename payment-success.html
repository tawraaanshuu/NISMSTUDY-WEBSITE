<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success — NISMSTUDY</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23059669'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3ENS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-badge">NS</span>
      <span>NISMSTUDY</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main id="main" class="auth-shell">
  <div class="container-narrow">
    <section class="card center">
      <span class="kicker">Activating access</span>
      <h1 style="font-size:clamp(1.8rem,2.8vw,2.5rem);margin:14px 0 16px;">Activating your exam access</h1>
      <div id="paymentSuccessBox" class="notice">Please wait…</div>
      <div class="action-row" style="justify-content:center; margin-top:20px;">
        <a class="btn btn-primary btn-lg hidden" id="goMockBtn" href="#">Start Mock Test</a>
        <a class="btn btn-secondary" href="dashboard.html">Go to Dashboard</a>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p class="small center">© 2026 NISMSTUDY. All rights reserved. · <a href="contact-us.html">Contact</a></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const box = document.getElementById('paymentSuccessBox');
  const goMockBtn = document.getElementById('goMockBtn');

  try {
    const auth = await NISM_APP.requireAuth('login.html');
    if (!auth) return;

    const courseId = NISM_APP.qs('course');
    const paymentStatus = NISM_APP.qs('payment_status');
    const paymentRef = NISM_APP.qs('payment_ref') || `web-${Date.now()}`;

    if (!courseId) {
      box.innerHTML = 'Missing exam reference. Open the <a href="dashboard.html">dashboard</a> and try again.';
      return;
    }

    const course = await NISM_APP.fetchCourse(courseId);
    if (!course) {
      box.innerHTML = 'Exam not found. Open the <a href="dashboard.html">dashboard</a> and try again.';
      return;
    }

    if (paymentStatus !== 'success') {
      box.className = 'notice warn';
      box.innerHTML = 'Your payment has not been confirmed yet. If money was deducted, email <a href="mailto:info@nismstudy.in">info@nismstudy.in</a> with your payment reference.';
      return;
    }

    const access = await NISM_APP.recordPaymentAndGrantAccess({
      user: auth.user,
      course,
      paymentRef,
      rawPayload: Object.fromEntries(new URLSearchParams(window.location.search).entries())
    });

    box.className = 'notice ok';
    box.innerHTML = `Payment recorded for <strong>${NISM_APP.escapeHtml(course.exam_name || course.title || 'exam')}</strong>.<br>Unlimited mocks are active until <strong>${NISM_APP.fmtDate(access.access_until)}</strong>.`;
    goMockBtn.href = `mock-center.html?course=${course.id}`;
    goMockBtn.classList.remove('hidden');
  } catch (error) {
    console.error(error);
    box.className = 'notice warn';
    box.innerHTML = NISM_APP.friendlyError(error, 'We could not activate your access automatically. Don\'t worry — email <a href="mailto:info@nismstudy.in">info@nismstudy.in</a> with your payment reference and we will activate it manually.');
  }
})();
</script>
<script src="chat-widget.js" defer></script>
</body>
</html>
