<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — NISMSTUDY</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23059669'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3ENS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-badge">NS</span>
      <span>NISMSTUDY</span>
    </a>
    <input type="checkbox" id="navToggle" class="nav-toggle-box">
    <label for="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</label>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
    </div>
  </div>
</header>

<main id="main" class="auth-shell">
  <div class="container">
    <section class="card">
      <span class="kicker">Secure exam access</span>
      <h1 style="font-size:clamp(1.8rem,2.8vw,2.5rem);margin:14px 0 16px;">Confirm your purchase</h1>
      <div id="checkoutCard">Loading exam details…</div>
      <div id="checkoutStatus" class="notice" style="margin-top:18px;">Payment is completed on our secure payment link.</div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p class="small center">© 2026 NISMSTUDY. All rights reserved. · <a href="refund-policy.html">Refund Policy</a> · <a href="contact-us.html">Contact</a></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const target = document.getElementById('checkoutCard');
  const status = document.getElementById('checkoutStatus');

  try {
    const auth = await NISM_APP.requireAuth('login.html');
    if (!auth) return;

    const courseId = NISM_APP.qs('course');
    if (!courseId) {
      target.innerHTML = '<div class="notice">No exam selected. <a href="dashboard.html">Go back to the dashboard</a>.</div>';
      return;
    }

    const course = await NISM_APP.fetchCourse(courseId);
    if (!course) {
      target.innerHTML = '<div class="notice">Exam not found. <a href="dashboard.html">Go back to the dashboard</a>.</div>';
      return;
    }

    target.innerHTML = `
      <div class="grid-2">
        <div class="card card-compact">
          <h3>${NISM_APP.escapeHtml(course.exam_name || course.title || 'Exam')}</h3>
          <p class="muted">${NISM_APP.escapeHtml(course.description || 'Unlimited mock tests after successful payment.')}</p>
          <p class="price" style="font-size:1.5rem;font-weight:800;">${NISM_APP.money(course.price)}</p>
          <p class="small">Access duration: ${course.mock_duration_days || 15} days · Unlimited attempts</p>
        </div>
        <div class="card card-compact">
          <h3>How payment works</h3>
          <ol class="inline-list">
            <li>Click <strong>Pay securely</strong>.</li>
            <li>Razorpay opens on this page — card, UPI, netbanking or wallet.</li>
            <li>We confirm the payment with Razorpay directly.</li>
            <li>Your access activates as soon as it clears.</li>
          </ol>
        </div>
      </div>
      <div class="action-row" style="margin-top:20px;">
        <button class="btn btn-primary btn-lg" id="paymentBtn" type="button">Pay securely</button>
        <a class="btn btn-secondary" href="dashboard.html">Cancel</a>
      </div>`;

    const paymentBtn = document.getElementById('paymentBtn');
    const fnBase = NISM_APP.cfg().functionsUrl;

    if (!fnBase || !NISM_APP.isCourseLive(course)) {
      paymentBtn.disabled = true;
      paymentBtn.textContent = !fnBase ? 'Payment temporarily unavailable' : 'Not on sale yet';
      status.className = 'notice warn';
      status.innerHTML = !fnBase
        ? 'Online payment is temporarily unavailable. Email <a href="mailto:info@nismstudy.in">info@nismstudy.in</a> to complete your purchase.'
        : 'This exam is not on sale yet — its question bank is still being prepared.';
      return;
    }

    status.innerHTML = 'Payments are handled by Razorpay. We never see or store your card details.';

    paymentBtn.addEventListener('click', async () => {
      paymentBtn.disabled = true;
      paymentBtn.textContent = 'Opening payment…';
      try {
        // The server decides the amount. Nothing about price is sent from here,
        // so a tampered client cannot buy a Rs 329 exam for Rs 1.
        const response = await fetch(`${fnBase}/razorpay-create-order`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${auth.session.access_token}`
          },
          body: JSON.stringify({ course_id: course.id })
        });
        const order = await response.json();
        if (!response.ok) throw new Error(order.error || 'Could not start the payment.');

        const rzp = new Razorpay({
          key: order.key_id,
          order_id: order.order_id,
          amount: order.amount,
          currency: order.currency,
          name: 'NISMSTUDY',
          description: order.course_title,
          prefill: { email: order.user_email },
          theme: { color: '#059669' },
          handler: () => {
            // Access is granted by the Razorpay webhook, not by this callback —
            // anything the browser reports here is unverified. The next page
            // polls the database until the webhook has actually landed.
            window.location.href =
              `payment-success.html?course=${encodeURIComponent(course.id)}` +
              `&order=${encodeURIComponent(order.order_id)}`;
          },
          modal: {
            ondismiss: () => {
              paymentBtn.disabled = false;
              paymentBtn.textContent = 'Pay securely';
              NISM_APP.setStatus(status, 'Payment cancelled. Nothing has been charged.', 'warn');
            }
          }
        });
        rzp.on('payment.failed', (e) => {
          NISM_APP.setStatus(status,
            `Payment failed: ${NISM_APP.escapeHtml(e?.error?.description || 'please try again')}.`, 'error');
          paymentBtn.disabled = false;
          paymentBtn.textContent = 'Pay securely';
        });
        rzp.open();
      } catch (error) {
        console.error(error);
        NISM_APP.setStatus(status, NISM_APP.escapeHtml(error.message || 'Could not start the payment.'), 'error');
        paymentBtn.disabled = false;
        paymentBtn.textContent = 'Pay securely';
      }
    });
  } catch (error) {
    console.error(error);
    target.innerHTML = `<div class="notice warn">${NISM_APP.friendlyError(error, 'Unable to load checkout details right now. Please refresh to try again.')}</div>`;
  }
})();
</script>
<script src="chat-widget.js" defer></script>
</body>
</html>
