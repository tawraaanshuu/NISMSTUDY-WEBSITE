<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Test — NISMSTUDY</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8cff'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3ENS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-badge">NS</span>
      <span>NISMSTUDY</span>
    </a>
    <input type="checkbox" id="navToggle" class="nav-toggle-box">
    <label for="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</label>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="mock-tests.html">Mock Tests</a>
    </nav>
    <div class="nav-actions">
      <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <span class="kicker">Unlimited attempts in your access window</span>
      <h1>Take your mock test</h1>
      <p>Answer every question, then submit to see your score instantly. Retake as many times as you like.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="mockMeta" class="card">Loading mock test…</div>
      <form id="mockForm" class="stack" style="margin-top:18px;"></form>
      <div id="mockActions" class="action-row hidden" style="margin-top:18px;">
        <button class="btn btn-primary btn-lg" type="submit" form="mockForm">Submit Mock</button>
        <button class="btn btn-secondary" type="button" id="retakeBtn">Retake</button>
      </div>
      <div id="mockResult" class="notice ok hidden" style="margin-top:18px;"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p class="small center">© 2026 NISMSTUDY. All rights reserved. · <a href="contact-us.html">Contact</a> · <a href="faq.html">FAQ</a></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  document.getElementById('logoutBtn').addEventListener('click', () => NISM_APP.signOutUser());

  const meta = document.getElementById('mockMeta');
  const form = document.getElementById('mockForm');
  const actions = document.getElementById('mockActions');
  const result = document.getElementById('mockResult');
  const retakeBtn = document.getElementById('retakeBtn');

  try {
    const auth = await NISM_APP.requireAuth('login.html');
    if (!auth) return;

    const courseId = NISM_APP.qs('course');
    if (!courseId) {
      meta.innerHTML = 'No exam selected. <a href="dashboard.html">Go back to the dashboard</a> and pick an exam.';
      return;
    }

    const [course, accessRecords] = await Promise.all([
      NISM_APP.fetchCourse(courseId),
      NISM_APP.fetchAccessRecords(auth.user.id)
    ]);

    const access = NISM_APP.findActiveAccess(accessRecords, courseId);
    if (!course || !access) {
      meta.innerHTML = 'Your access for this exam is not active. <a href="dashboard.html">Purchase it from the dashboard</a> first.';
      return;
    }

    const quizzes = await NISM_APP.fetchQuizzes(courseId);
    meta.innerHTML = `
      <div class="badge-row">
        <span class="status-pill ok">Access active until ${NISM_APP.fmtDate(access.access_until)}</span>
        <span class="pill info">${quizzes.length} question(s)</span>
      </div>
      <h3>${NISM_APP.escapeHtml(course.exam_name || course.title || 'Mock Test')}</h3>
      <p class="muted">Submit when finished. You can retake this mock any number of times before your access ends.</p>`;

    if (!quizzes.length) {
      form.innerHTML = '<div class="notice">No questions have been added for this exam yet. Please check back soon.</div>';
      return;
    }

    renderQuiz(quizzes);
    actions.classList.remove('hidden');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      let score = 0;
      const answers = [];
      quizzes.forEach((quiz) => {
        const selected = form.querySelector(`input[name="q_${quiz.id}"]:checked`);
        const answer = selected ? selected.value : '';
        const correct = answer === quiz.correct_option;
        if (correct) score += 1;
        answers.push({ question_id: quiz.id, answer, correct });
      });

      const pct = Math.round((score / quizzes.length) * 100);
      result.classList.remove('hidden');
      result.innerHTML = `You scored <strong>${score} / ${quizzes.length}</strong> (${pct}%). You can retake this mock anytime before <strong>${NISM_APP.fmtDate(access.access_until)}</strong>.`;

      try {
        await NISM_APP.saveMockAttempt({
          userId: auth.user.id,
          courseId,
          score,
          totalQuestions: quizzes.length,
          answers
        });
      } catch (saveError) {
        console.error(saveError);
      }
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    retakeBtn.addEventListener('click', () => {
      form.reset();
      result.classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  } catch (error) {
    console.error(error);
    meta.innerHTML = `<div class="notice warn">${NISM_APP.friendlyError(error, 'Unable to load the mock test right now. Please refresh to try again.')}</div>`;
  }

  function renderQuiz(quizzes) {
    form.innerHTML = quizzes.map((quiz, index) => `
      <article class="card quiz-question">
        <div class="badge-row"><span class="pill info">Question ${index + 1}</span></div>
        <h3>${NISM_APP.escapeHtml(quiz.question_text)}</h3>
        <div class="option-list">
          ${['A', 'B', 'C', 'D'].map(option => `
            <label class="option-item">
              <input type="radio" name="q_${quiz.id}" value="${option}">
              <span><strong>${option}.</strong> ${NISM_APP.escapeHtml(quiz['option_' + option.toLowerCase()] || '')}</span>
            </label>`).join('')}
        </div>
      </article>`).join('');
  }
})();
</script>
</body>
</html>
